name: unpack
on:
  push:
    paths: ['bundle.json']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: 'test -f bundle.json && python3 -c "import json,os;d=json.load(open(\"bundle.json\"));[(os.makedirs(os.path.dirname(p) or \".\",exist_ok=True),open(p,\"w\").write(c)) for p,c in d.items()]" && rm bundle.json && git config user.name "Somu Kandula" && git config user.email somukandula99@gmail.com && git add -A && git commit -m "Add Reroute my day source" && git push'
